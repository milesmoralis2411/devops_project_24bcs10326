# Local multi-node Kubernetes cluster for the demo (kind = Kubernetes in Docker).
#   kind create cluster --config k8s/kind-cluster.yaml
# Host port 80 is mapped to NodePort 30080, where the Traefik ingress controller listens,
# so http://stockpilot.localtest.me reaches the Ingress from the laptop's browser.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: stockpilot
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
  - role: worker
  - role: worker

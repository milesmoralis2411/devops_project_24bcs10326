# EKS only. Since Kubernetes 1.30, new EKS clusters no longer mark the legacy gp2
# StorageClass as default, so a PersistentVolumeClaim without a class stays Pending.
# This creates an encrypted gp3 class backed by the EBS CSI driver add-on that
# terraform/eks.tf installs, and makes it the default.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"

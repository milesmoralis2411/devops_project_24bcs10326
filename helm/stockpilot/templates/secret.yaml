{{- /*
Database credentials. When no password is supplied, a random one is generated on the
first install and read back from the existing Secret on every upgrade (lookup), so a
`helm upgrade` never rotates the password out from under the running database.
*/ -}}
{{- $secretName := include "stockpilot.dbSecretName" . -}}
{{- $password := .Values.postgres.password -}}
{{- if not $password -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if and $existing $existing.data (hasKey $existing.data "POSTGRES_PASSWORD") -}}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 24 -}}
{{- end -}}
{{- end -}}
{{- $databaseUrl := .Values.externalDatabase.url -}}
{{- if .Values.postgres.enabled -}}
{{- $databaseUrl = printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.postgres.username ($password | urlquery) (include "stockpilot.postgresName" .) .Values.postgres.database -}}
{{- end -}}
{{- if not $databaseUrl -}}
{{- fail "Set postgres.enabled=true or provide externalDatabase.url" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ $databaseUrl | quote }}

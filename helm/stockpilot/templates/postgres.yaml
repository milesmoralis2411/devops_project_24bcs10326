{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stockpilot.postgresName" . }}
  labels:
    {{- include "stockpilot.componentLabels" (dict "ctx" . "component" "database") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "stockpilot.selectorLabels" (dict "ctx" . "component" "database") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# StatefulSet (not Deployment): stable identity and a PersistentVolumeClaim per replica,
# so the data survives pod restarts and rescheduling.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "stockpilot.postgresName" . }}
  labels:
    {{- include "stockpilot.componentLabels" (dict "ctx" . "component" "database") | nindent 4 }}
spec:
  serviceName: {{ include "stockpilot.postgresName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "stockpilot.selectorLabels" (dict "ctx" . "component" "database") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stockpilot.componentLabels" (dict "ctx" . "component" "database") | nindent 8 }}
    spec:
      securityContext:
        # UID 70 is the "postgres" user in the Alpine image.
        {{- include "stockpilot.podSecurityContext" (dict "uid" 70) | nindent 8 }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ include "stockpilot.dbSecretName" . }}
          env:
            # Sub-directory: a fresh cloud volume (e.g. EBS) contains lost+found,
            # and initdb refuses to run in a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            {{- include "stockpilot.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "stockpilot.selectorLabels" (dict "ctx" . "component" "database") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storage.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}

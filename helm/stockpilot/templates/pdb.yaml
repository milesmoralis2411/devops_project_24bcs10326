{{- /* PodDisruptionBudgets keep at least one replica up during node drains / upgrades. */ -}}
{{- range $component := list "backend" "frontend" }}
{{- $cfg := index $.Values $component }}
{{- if $cfg.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "stockpilot.fullname" $ }}-{{ $component }}
  labels:
    {{- include "stockpilot.componentLabels" (dict "ctx" $ "component" $component) | nindent 4 }}
spec:
  minAvailable: {{ $cfg.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "stockpilot.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
{{- end }}
{{- end }}

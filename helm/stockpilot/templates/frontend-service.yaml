apiVersion: v1
kind: Service
metadata:
  name: {{ include "stockpilot.frontendName" . }}
  labels:
    {{- include "stockpilot.componentLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "stockpilot.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

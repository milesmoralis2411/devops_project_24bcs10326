# StockPilot delivery pipeline
#
#   ┌─────────────┐  ┌──────────────┐  ┌─────────────┐
#   │ backend-test│  │frontend-build│  │ iac-validate│      quality gates (parallel)
#   └──────┬──────┘  └──────┬───────┘  └──────┬──────┘
#          └────────────────┼─────────────────┘
#                    ┌──────▼───────┐
#                    │ build-scan-  │  docker build -> Trivy (fail on HIGH/CRITICAL)
#                    │ push (x2)    │  -> push ghcr.io/<owner>/stockpilot-*:<git sha>
#                    └──────┬───────┘
#                    ┌──────▼───────┐
#                    │    deploy    │  helm upgrade --install on EKS (main branch only)
#                    └──────────────┘
#
# Supply-chain hygiene: every third-party action is pinned to a full commit SHA (the tag
# is in the trailing comment). Tags can be moved - in March 2026 attackers force-pushed
# most aquasecurity/trivy-action tags to credential-stealing commits - a SHA cannot.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  HELM_VERSION: v4.3.0
  TERRAFORM_VERSION: 1.16.5
  TRIVY_VERSION: v0.75.0

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend: lint, unit tests (SQLite) and the same tests on real PostgreSQL,
  #    plus a migration up/down/up round-trip. Any failure stops the pipeline,
  #    so no image is ever built from broken code.
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stockpilot
          POSTGRES_PASSWORD: stockpilot
          POSTGRES_DB: stockpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockpilot -d stockpilot_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check . --output-format=github
          ruff format --check .

      - name: Unit tests on isolated SQLite database
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml --junitxml=test-results/junit-sqlite.xml

      - name: Same tests on a throw-away PostgreSQL service container
        env:
          TEST_DATABASE_URL: postgresql+psycopg://stockpilot:stockpilot@localhost:5432/stockpilot_test
        run: pytest -v --junitxml=test-results/junit-postgres.xml

      - name: Alembic migrations upgrade -> downgrade -> upgrade on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://stockpilot:stockpilot@localhost:5432/stockpilot_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            backend/test-results/
            backend/coverage.xml

  # ---------------------------------------------------------------------------
  # 2. Frontend: dependency install from the lockfile, unit tests, production build
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist

  # ---------------------------------------------------------------------------
  # 3. Infrastructure as code: Terraform fmt/validate/test (mocked AWS, so no
  #    credentials needed) and Helm chart lint/render for both environments.
  # ---------------------------------------------------------------------------
  iac-validate:
    name: Terraform & Helm validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform fmt / init / validate / test
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: helm lint + template
        run: |
          helm lint helm/stockpilot -f helm/stockpilot/values-dev.yaml
          helm lint helm/stockpilot -f helm/stockpilot/values-prod.yaml --set backend.image.tag=ci --set frontend.image.tag=ci
          helm template stockpilot helm/stockpilot -n stockpilot -f helm/stockpilot/values-prod.yaml \
            --api-versions monitoring.coreos.com/v1/ServiceMonitor \
            --api-versions monitoring.coreos.com/v1/PrometheusRule > /dev/null

  # ---------------------------------------------------------------------------
  # 4. Build both images, scan them with Trivy, push to GHCR tagged with the
  #    commit SHA. Pull requests build and scan but never push.
  # ---------------------------------------------------------------------------
  build-scan-push:
    name: Build, scan & push (${{ matrix.component }})
    needs: [backend-test, frontend-build, iac-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image name (GHCR requires a lower-case owner)
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=${REGISTRY}/${owner}/stockpilot-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "ref=${REGISTRY}/${owner}/stockpilot-${{ matrix.component }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (loaded locally for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          load: true
          push: false
          tags: ${{ steps.image.outputs.ref }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Trivy vulnerability report (all severities, informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          version: ${{ env.TRIVY_VERSION }}
          format: table
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy security gate - fail on fixable HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          version: ${{ env.TRIVY_VERSION }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
          skip-setup-trivy: true

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image tagged with the commit SHA
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ steps.image.outputs.ref }}"
          {
            echo "### ${{ matrix.component }} image"
            echo ""
            echo "\`${{ steps.image.outputs.ref }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 5. Deploy to EKS with Helm (main branch only). Authenticates to AWS with
  #    GitHub OIDC - no long-lived AWS keys stored in GitHub. Skipped until the
  #    repository variables below are configured (see docs/SETUP-GITHUB.md):
  #      AWS_DEPLOY_ROLE_ARN, AWS_REGION, EKS_CLUSTER_NAME
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EKS (Helm)
    needs: build-scan-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Configure kubectl for the EKS cluster
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION || 'ap-south-1' }}" --name "${{ vars.EKS_CLUSTER_NAME || 'stockpilot-eks' }}"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: helm upgrade --install (image tag = commit SHA)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/eks-storageclass-gp3.yaml
          helm upgrade --install stockpilot ./helm/stockpilot \
            --namespace stockpilot \
            -f helm/stockpilot/values-prod.yaml \
            --set backend.image.repository="${REGISTRY}/${owner}/stockpilot-backend" \
            --set backend.image.tag="${GITHUB_SHA}" \
            --set frontend.image.repository="${REGISTRY}/${owner}/stockpilot-frontend" \
            --set frontend.image.tag="${GITHUB_SHA}" \
            --wait --timeout 10m

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/stockpilot-backend -n stockpilot --timeout=5m
          kubectl rollout status deployment/stockpilot-frontend -n stockpilot --timeout=5m
          helm test stockpilot -n stockpilot --logs
          kubectl get pods,svc,ingress,hpa -n stockpilot

      - name: Show the public URL
        run: |
          lb="$(kubectl get svc traefik -n traefik -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
          echo "### Deployed \`${GITHUB_SHA::7}\` to EKS" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$lb" ] && echo "App: http://$lb" >> "$GITHUB_STEP_SUMMARY" || true

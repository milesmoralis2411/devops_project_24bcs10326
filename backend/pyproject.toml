[project]
name = "stockpilot-backend"
version = "1.0.0"
description = "StockPilot inventory management API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/script.py.mako"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import sorting, bugbear, pyupgrade, simplify
select = ["F", "E", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in default arguments is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.coverage.run]
source = ["app"]
omit = ["app/prestart.py"]
